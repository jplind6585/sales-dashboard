name: Backfill Historical Gong Calls

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Import calls from this date (YYYY-MM-DD). Defaults to 2 years ago.'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Import all historical Gong calls with transcripts
        run: |
          FROM_DATE="${{ github.event.inputs.from_date }}"
          cursor=""
          iteration=0
          max_iterations=200
          total_imported=0
          total_skipped=0

          while [ $iteration -lt $max_iterations ]; do
            if [ -z "$cursor" ] && [ -z "$FROM_DATE" ]; then
              payload='{}'
            elif [ -z "$cursor" ] && [ -n "$FROM_DATE" ]; then
              payload="{\"fromDate\": \"${FROM_DATE}\"}"
            elif [ -n "$cursor" ] && [ -z "$FROM_DATE" ]; then
              payload="{\"cursor\": \"${cursor}\"}"
            else
              payload="{\"cursor\": \"${cursor}\", \"fromDate\": \"${FROM_DATE}\"}"
            fi

            # Use -w to capture HTTP status code; do NOT use -f so we can see the response body on errors
            raw=$(curl -s -w "\n%{http_code}" \
              -X POST "${{ secrets.PRODUCTION_URL }}/api/gong/backfill-historical" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "$payload")

            status=$(echo "$raw" | tail -1)
            body=$(echo "$raw" | head -1)

            echo "Iteration $iteration — HTTP $status"

            if [ "$status" != "200" ]; then
              echo "ERROR: Expected 200, got $status"
              echo "Response: $body"
              exit 1
            fi

            imported=$(echo "$body" | jq -r '.imported // 0')
            skipped=$(echo "$body" | jq -r '.skipped // 0')
            done=$(echo "$body" | jq -r '.done // "false"')
            next_cursor=$(echo "$body" | jq -r '.cursor // ""')
            err=$(echo "$body" | jq -r '.error // ""')

            if [ -n "$err" ] && [ "$err" != "null" ]; then
              echo "ERROR on iteration $iteration: $err"
              echo "Full response: $body"
              exit 1
            fi

            total_imported=$((total_imported + imported))
            total_skipped=$((total_skipped + skipped))
            echo "  imported=$imported skipped=$skipped done=$done"

            if [ "$done" = "true" ]; then
              echo "All historical calls imported. Total: imported=$total_imported skipped=$total_skipped"
              break
            fi

            cursor="$next_cursor"
            iteration=$((iteration + 1))

            sleep 3
          done

          if [ $iteration -eq $max_iterations ]; then
            echo "WARNING: Hit max iterations ($max_iterations). Re-run workflow to continue."
            echo "Total so far: imported=$total_imported skipped=$total_skipped"
          fi

      - name: Auto-link imported calls to accounts
        run: |
          echo "Running match-calls to link all imported calls to accounts..."
          raw=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.PRODUCTION_URL }}/api/hubspot/match-calls" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$raw" | tail -1)
          body=$(echo "$raw" | head -1)
          echo "HTTP $status — $body"
          matched=$(echo "$body" | jq -r '.matched // 0')
          total=$(echo "$body" | jq -r '.total // 0')
          echo "Linked $matched of $total unlinked calls to accounts"
