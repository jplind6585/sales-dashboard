name: Drain Full Analysis Backlog

on:
  workflow_dispatch:

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Process all unanalyzed calls until backlog is empty
        run: |
          iteration=0
          max_iterations=100
          total_processed=0
          total_failed=0
          consecutive_errors=0

          while [ $iteration -lt $max_iterations ]; do
            body=$(curl -s --max-time 290 -w "\n%{http_code}" \
              -X POST "${{ secrets.PRODUCTION_URL }}/api/cron/process-backlog" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json")
            status=$(echo "$body" | tail -1)
            response=$(echo "$body" | head -1)

            echo "Iteration $iteration — HTTP $status"

            # Treat 5xx and curl timeout (000) as transient — back off and retry
            if [ "$status" = "504" ] || [ "$status" = "503" ] || [ "$status" = "502" ] || [ "$status" = "500" ] || [ "$status" = "000" ]; then
              consecutive_errors=$((consecutive_errors + 1))
              echo "  Transient error $status (${consecutive_errors} consecutive) — backing off 30s"
              if [ $consecutive_errors -ge 6 ]; then
                echo "ERROR: 6 consecutive errors — aborting"
                exit 1
              fi
              sleep 30
              iteration=$((iteration + 1))
              continue
            fi

            if [ "$status" != "200" ]; then
              echo "ERROR: Unexpected HTTP $status — $response"
              exit 1
            fi

            consecutive_errors=0
            processed=$(echo "$response" | jq -r '.processed // 0')
            failed=$(echo "$response" | jq -r '.failed // 0')
            remaining=$(echo "$response" | jq -r '.remaining // 0')

            total_processed=$((total_processed + processed))
            total_failed=$((total_failed + failed))

            echo "  processed=$processed failed=$failed remaining=$remaining total_so_far=$total_processed"

            if [ "$remaining" -eq 0 ]; then
              echo "Backlog cleared. Total analyzed: $total_processed, failed: $total_failed"
              break
            fi

            iteration=$((iteration + 1))
            sleep 5
          done

          if [ $iteration -eq $max_iterations ]; then
            echo "WARNING: Hit max iterations. Re-run to continue. Processed so far: $total_processed"
          fi

      - name: Link all calls to accounts
        run: |
          echo "Linking all calls to accounts..."
          body=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.PRODUCTION_URL }}/api/hubspot/match-calls" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$body" | tail -1)
          response=$(echo "$body" | head -1)
          matched=$(echo "$response" | jq -r '.matched // 0')
          total=$(echo "$response" | jq -r '.total // 0')
          echo "HTTP $status — Linked $matched of $total unlinked calls"
