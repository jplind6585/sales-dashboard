name: Process Recent Gong Calls

on:
  schedule:
    # Every 15 minutes (doubled from 30 min to clear backlog faster)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  process-recent:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger post-call processing
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.PRODUCTION_URL }}/api/cron/process-recent-calls" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$body" | tail -1)
          response=$(echo "$body" | head -1)
          echo "Status: $status"
          echo "Response: $response"
          if [ "$status" != "200" ]; then
            echo "ERROR: Expected 200, got $status"
            exit 1
          fi

  process-backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Process unanalyzed call backlog (75 calls/run)
        run: |
          body=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.PRODUCTION_URL }}/api/cron/process-backlog" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$body" | tail -1)
          response=$(echo "$body" | head -1)
          echo "Status: $status"
          echo "Response: $response"

      - name: Run match-calls to link newly analyzed calls to accounts
        run: |
          curl -s -o /dev/null \
            -X POST "${{ secrets.PRODUCTION_URL }}/api/hubspot/match-calls" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
          echo "match-calls triggered"
